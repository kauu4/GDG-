<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape the Matrix | Campus Marketplace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    /* 🏹 Bow Emoji Cursor (Left-Facing & Compact) */
    body, button, input, select, textarea, a, div {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'><text y='18' font-size='18'>🏹</text></svg>") 0 0, auto !important;
    }

    /* Arrow Shot Click Animation */
    .arrow-shot-animation {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 16px;
      animation: shootArrow 0.5s ease-out forwards;
    }

    @keyframes shootArrow {
      0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
      100% { transform: translate(-80px, -80px) scale(0.6); opacity: 0; }
    }

    /* Image Hover Outline Effect */
    .image-card-hover {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .image-card-container:hover .image-card-hover {
      transform: scale(1.08);
    }
    .image-card-container:hover {
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.7);
      border-color: #6366f1;
    }
  </style>
</head>
<body class="antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GEMINI_API_KEY = ""; 
    const WEATHER_API_KEY = ""; 

    // Quantity-Based Fast SVG Bar Chart Component
    function QuantityBarChart({ data, dataKey, color }) {
      const maxValue = Math.max(...data.map(d => d[dataKey]));
      return (
        <div className="w-full h-40 flex items-end justify-between gap-3 pt-6 pb-2 px-2">
          {data.map((item, idx) => {
            const heightPct = Math.round((item[dataKey] / maxValue) * 100);
            return (
              <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative">
                <div className="text-[10px] text-indigo-400 mb-1 opacity-0 group-hover:opacity-100 transition font-bold">
                  {item[dataKey]} Units
                </div>
                <div 
                  style={{ height: `${heightPct}%`, backgroundColor: color }}
                  className="w-full rounded-t-md transition-all duration-500 hover:brightness-125"
                ></div>
                <span className="text-[10px] text-slate-400 mt-2 truncate w-full text-center">
                  {item.name}
                </span>
              </div>
            );
          })}
        </div>
      );
    }

    // Top 5 Item Quantities Data
    const quantityAnalyticsData = [
      { name: 'Escape Matrix', sellQty: 185, buyQty: 210 },
      { name: 'Headphones', sellQty: 120, buyQty: 150 },
      { name: 'USB Charger', sellQty: 98, buyQty: 130 },
      { name: 'DSA Textbook', sellQty: 86, buyQty: 110 },
      { name: 'Graphing Calc', sellQty: 72, buyQty: 95 }
    ];

    // 20+ Sample Products (Textbooks, Headphones, Chargers, Lab Gear)
    const initialListings = [
      { id: '1', title: 'Escape the Matrix', description: 'Ultimate campus survival & productivity guide book.', price: 499, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500', isMine: false },
      { id: '2', title: 'Data Structures & Algorithms', description: 'Core CS concepts textbook with C/C++ examples.', price: 550, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=500', isMine: false },
      { id: '3', title: 'Physics for Engineers Vol 1', description: 'Standard reference book for engineering physics.', price: 420, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=500', isMine: false },
      { id: '4', title: 'Organic Chemistry Handbook', description: 'Complete reaction mechanism study guide.', price: 600, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=500', isMine: false },
      { id: '5', title: 'Digital Electronics Systems', description: 'Logic gates and microprocessors manual.', price: 480, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=500', isMine: false },
      { id: '6', title: 'Sony Over-Ear Studio Headphones', description: 'Noise-canceling deep bass study headphones.', price: 2499, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500', isMine: true },
      { id: '7', title: 'Anker Fast Type-C Charger 65W', description: 'Ultra-fast laptop and mobile wall adapter.', price: 1299, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=500', isMine: false },
      { id: '8', title: 'JBL Wireless Sports Earbuds', description: 'Sweatproof Bluetooth earphones for campus gym.', price: 1899, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500', isMine: false },
      { id: '9', title: 'Apple 20W USB-C Power Adapter', description: 'Original fast charger brick for iPhones.', price: 1499, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1622445268465-843d63d03713?w=500', isMine: false },
      { id: '10', title: 'Boat Bassheads Wired Earphones', description: 'Tangle-free durable auxiliary wired headphones.', price: 399, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500', isMine: false },
      { id: '11', title: 'Samsung 25W Super Fast Charger', description: 'Type-C to Type-C fast charging kit.', price: 999, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1585338107529-13afc5f02586?w=500', isMine: false },
      { id: '12', title: 'Sennheiser Studio Monitor Headphones', description: 'Hi-Fi professional audio headphones.', price: 3499, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500', isMine: false },
      { id: '13', title: 'Multi-Plug Surge Protector Extension', description: '4-Socket power board with dual USB ports.', price: 799, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500', isMine: false },
      { id: '14', title: 'Realme Buds Wireless Neckband', description: '17-Hour battery neckband wireless earphone.', price: 1199, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1572536147248-ac59a8abfa4b?w=500', isMine: false },
      { id: '15', title: 'MagSafe Magnetic Wireless Charger', description: 'Qi Wireless charging pad for dorm desk.', price: 1599, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1617839625591-e5a789593135?w=500', isMine: false },
      { id: '16', title: 'Chemistry Lab Coat & Safety Goggles', description: 'Standard cotton lab coat set.', price: 650, category: 'Lab Supplies', status: 'sold', image_url: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?w=500', isMine: true },
      { id: '17', title: 'Ergonomic Study Desk Lamp', description: 'Warm LED lamp with touch controls.', price: 799, category: 'Essentials', status: 'available', image_url: 'https://images.unsplash.com/photo-1534353436294-0dbd4bdac845?w=500', isMine: false },
      { id: '18', title: 'Casio FX-991EX Scientific Calculator', description: 'Non-programmable exam approved calculator.', price: 1250, category: 'Cheaper than your College', status: 'available', image_url: 'https://images.unsplash.com/photo-1611117775350-ac3950990985?w=500', isMine: false },
      { id: '19', title: 'Insulated Thermal Water Bottle 1L', description: 'Keeps water cold for 24 hours.', price: 450, category: 'Essentials', status: 'available', image_url: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500', isMine: false },
      { id: '20', title: 'Engineering Drafting Mini-Drafter', description: 'Precision graphics tool with carrying canvas bag.', price: 650, category: 'Others', status: 'available', image_url: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500', isMine: false },
    ];

    // Incognito Stealth Mode Items
    const incognitoListings = [
      { id: 'inc-1', title: 'Secret Vape Pod Mod 5000', description: 'Discreet rechargeable flavor pod.', price: 1200, category: 'Incognito Special', image_url: 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=500' },
      { id: 'inc-2', title: 'Stealth Black Undergarments 3-Pack', description: 'Unmarked plain delivery box.', price: 899, category: 'Incognito Special', image_url: 'https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500' },
      { id: 'inc-3', title: 'Discreet Mint Nicotine Pouches', description: 'Sealed pocket pack.', price: 350, category: 'Incognito Special', image_url: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500' }
    ];

    function App() {
      // LocalStorage Cache Initialization
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('matrix_auth') === 'true');
      const [username, setUsername] = useState(() => localStorage.getItem('matrix_user') || '');
      const [password, setPassword] = useState('');
      const [listings, setListings] = useState(() => {
        const saved = localStorage.getItem('matrix_listings');
        return saved ? JSON.parse(saved) : initialListings;
      });
      const [wishlist, setWishlist] = useState(() => {
        const saved = localStorage.getItem('matrix_wishlist');
        return saved ? JSON.parse(saved) : [];
      });

      // Navigation & World Pages
      const [activePage, setActivePage] = useState('explore'); // 'explore' | 'escaped'
      const [showOrdersModal, setShowOrdersModal] = useState(false);
      const [isIncognito, setIsIncognito] = useState(false);

      // Filters & Search
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [wishlistName, setWishlistName] = useState('My Favorites');
      const [toastMessage, setToastMessage] = useState('');

      // Uniform Timer Popup (1 Min Timer)
      const [showUniformTimer, setShowUniformTimer] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(60);

      // Create Sell Modal
      const [showSellModal, setShowSellModal] = useState(false);
      const [formTitle, setFormTitle] = useState('');
      const [formCategory, setFormCategory] = useState('Textbooks');
      const [formPrice, setFormPrice] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formImage, setFormImage] = useState('https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500');
      const [isGenerating, setIsGenerating] = useState(false);

      // Celebration Overlay State
      const [celebrationMsg, setCelebrationMsg] = useState('');

      const ordersModalRef = useRef();
      const sellModalRef = useRef();

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Cache Persistence
      useEffect(() => {
        localStorage.setItem('matrix_listings', JSON.stringify(listings));
      }, [listings]);

      useEffect(() => {
        localStorage.setItem('matrix_wishlist', JSON.stringify(wishlist));
      }, [wishlist]);

      // Click Arrow Shot Animation Listener
      useEffect(() => {
        const handleArrowClick = (e) => {
          const arrowEl = document.createElement('div');
          arrowEl.className = 'arrow-shot-animation';
          arrowEl.innerText = '🏹';
          arrowEl.style.left = `${e.clientX}px`;
          arrowEl.style.top = `${e.clientY}px`;
          document.body.appendChild(arrowEl);
          setTimeout(() => arrowEl.remove(), 500);
        };
        window.addEventListener('click', handleArrowClick);
        return () => window.removeEventListener('click', handleArrowClick);
      }, []);

      // 1-Minute Junior Uniform Timer trigger upon login
      useEffect(() => {
        if (isAuthenticated) {
          setShowUniformTimer(true);
          const interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                setShowUniformTimer(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }
      }, [isAuthenticated]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // Confetti & Celebration Trigger
      const triggerCelebration = (actionText) => {
        setCelebrationMsg(actionText);
        if (window.confetti) {
          window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
        setTimeout(() => setCelebrationMsg(''), 4000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (username && password) {
          setIsAuthenticated(true);
          localStorage.setItem('matrix_auth', 'true');
          localStorage.setItem('matrix_user', username);
          triggerToast(`Logged in as ${username}`);
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        localStorage.removeItem('matrix_auth');
      };

      const toggleWishlist = (id, title) => {
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(item => item !== id));
          triggerToast(`Removed "${title}"`);
        } else {
          setWishlist([...wishlist, id]);
          triggerToast(`❤️ Added "${title}" to ${wishlistName}!`);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleGenerateAI = async () => {
        if (!formTitle) return alert('Please enter a product title first!');
        setIsGenerating(true);
        try {
          if (!GEMINI_API_KEY) {
            setTimeout(() => {
              setFormDesc(`Pristine condition ${formTitle} under ${formCategory}. Essential item for campus students!`);
              setIsGenerating(false);
            }, 600);
            return;
          }
          const prompt = `Write a concise 3-sentence marketplace description for "${formTitle}" in category "${formCategory}".`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          setFormDesc(data?.candidates?.[0]?.content?.parts?.[0]?.text || `High quality ${formTitle} for students!`);
        } catch {
          alert('Failed to generate description.');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleAddListing = (e) => {
        e.preventDefault();
        const newListing = {
          id: Date.now().toString(),
          title: formTitle,
          category: formCategory,
          price: parseFloat(formPrice),
          description: formDesc,
          status: 'available',
          image_url: formImage,
          isMine: true
        };
        setListings([newListing, ...listings]);
        setShowSellModal(false);
        setFormTitle('');
        setFormPrice('');
        setFormDesc('');
        triggerCelebration(`Listing Published! You are already better than the college you study in! 🎓🚀`);
      };

      const toggleStatus = (id) => {
        setListings(listings.map(item => item.id === id ? { ...item, status: item.status === 'available' ? 'sold' : 'available' } : item));
        triggerCelebration(`Order Updated! You are already better than the college you study in! 🎉`);
      };

      // Modal Backdrop Click Close Logic
      const handleModalBackdropClick = (e, ref, closeFn) => {
        if (ref.current && e.target === ref.current) closeFn();
      };

      const myProducts = listings.filter(item => item.isMine);
      const soldItems = myProducts.filter(item => item.status === 'sold');
      const totalEarned = soldItems.reduce((sum, item) => sum + item.price, 0);

      // Smooth Case-Insensitive Search Engine
      const currentDataset = isIncognito ? incognitoListings : listings;
      const filteredListings = currentDataset.filter(item => {
        const query = searchQuery.toLowerCase().trim();
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              item.description.toLowerCase().includes(query) ||
                              item.category.toLowerCase().includes(query);
        const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
        const matchesPageFilter = activePage === 'escaped' ? item.isMine : true;
        return matchesSearch && matchesCategory && matchesPageFilter;
      });

      // PAGE 1: LOGIN GATE
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
              <div className="text-center mb-8">
                <div className="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-3">
                  <i data-lucide="zap" className="w-8 h-8"></i>
                </div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                  Escape the Matrix
                </h1>
                <p className="text-slate-400 text-xs mt-1">Campus Marketplace Login</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Username / Email</label>
                  <input
                    type="text"
                    required
                    placeholder="student@university.edu"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Password</label>
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-indigo-500"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-sm text-white transition shadow-lg shadow-indigo-600/30"
                >
                  Enter Marketplace
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-500 ${isIncognito ? 'bg-black text-rose-100' : 'bg-slate-950 text-slate-100'}`}>
          
          {/* PARTY CELEBRATION OVERLAY */}
          {celebrationMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-gradient-to-r from-emerald-500 via-indigo-600 to-amber-500 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-center animate-bounce border-2 border-white">
              🎉 Congratulations! {celebrationMsg}
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-16 right-5 z-50 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2">
              <i data-lucide="bell" className="w-4 h-4"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* JUNIOR UNIFORM TIMER FLOATING POPUP (1 MINUTE TIMER) */}
          {showUniformTimer && (
            <div className="fixed bottom-4 left-4 z-40 bg-red-950/90 border border-red-700 text-red-200 p-3 rounded-xl shadow-2xl max-w-sm flex items-center gap-3 backdrop-blur-md">
              <span className="text-2xl font-bold text-red-400">{timerSeconds}s</span>
              <div className="text-[11px] leading-tight">
                <p className="font-bold text-white">Sell your uniform here for your juniors otherwise burn it and sell the ashes! 😡🔥👕</p>
              </div>
              <button onClick={() => setShowUniformTimer(false)} className="text-red-400 hover:text-white">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>
          )}

          {/* GLOBAL HEADER */}
          <header className={`sticky top-0 z-30 border-b backdrop-blur ${isIncognito ? 'bg-zinc-950/90 border-rose-950' : 'bg-slate-900/90 border-slate-800'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
              
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActivePage('explore')}>
                <i data-lucide="zap" className="w-7 h-7 text-indigo-400"></i>
                <span className="font-bold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                  Escape the Matrix
                </span>
              </div>

              {/* 3 DISTINCT UN-REPEATED NAVIGATION OPTIONS */}
              <div className="flex items-center gap-1 sm:gap-2 bg-slate-800/80 p-1 rounded-full border border-slate-700 text-xs">
                <button
                  onClick={() => setActivePage('explore')}
                  className={`px-3 py-1.5 rounded-full font-semibold transition ${activePage === 'explore' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  Explore Feed
                </button>

                <button
                  onClick={() => setActivePage('escaped')}
                  className={`px-3 py-1.5 rounded-full font-semibold transition ${activePage === 'escaped' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  Escaped (Stock & Seller)
                </button>

                <button
                  onClick={() => setShowOrdersModal(true)}
                  className="px-3 py-1.5 rounded-full font-semibold text-slate-300 hover:text-white flex items-center gap-1"
                >
                  <i data-lucide="shopping-bag" className="w-3.5 h-3.5 text-amber-400"></i>
                  My Orders
                </button>
              </div>

              {/* USER PROFILE & LOGOUT */}
              <div className="flex items-center gap-3 text-xs">
                <span className="hidden sm:inline text-slate-400">👤 {username}</span>
                <button onClick={handleLogout} className="text-slate-400 hover:text-rose-400">
                  <i data-lucide="log-out" className="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN PAGE CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            
            {/* TOP QUANTITY ANALYTICS AT TOP OF EXPLORE */}
            {activePage === 'explore' && !isIncognito && (
              <div className="mb-8 space-y-3">
                <div>
                  <h2 className="text-xl font-bold">📊 Top 5 Campus Item Quantities</h2>
                  <p className="text-xs text-slate-400">Live units in circulation and purchase demand</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="p-4 rounded-2xl border bg-slate-900 border-slate-800">
                    <h3 className="text-xs font-bold text-slate-400 uppercase">Top 5 Most Sold Item Quantities</h3>
                    <QuantityBarChart data={quantityAnalyticsData} dataKey="sellQty" color="#6366f1" />
                  </div>

                  <div className="p-4 rounded-2xl border bg-slate-900 border-slate-800">
                    <h3 className="text-xs font-bold text-slate-400 uppercase">Top 5 Highest Demanded Quantities</h3>
                    <QuantityBarChart data={quantityAnalyticsData} dataKey="buyQty" color="#10b981" />
                  </div>
                </div>
              </div>
            )}

            {/* ESCAPED PAGE SPECIFIC HEADING & SELL BUTTON (NO REPEAT ON MAIN) */}
            {activePage === 'escaped' && (
              <div className="mb-8 p-6 rounded-2xl border bg-slate-900 border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <h2 className="text-2xl font-bold text-emerald-400">Seller World & Stock Portal</h2>
                  <p className="text-xs text-slate-400 mt-1">Track your active listings, manage sold items, and publish new stock.</p>
                </div>
                <button
                  onClick={() => setShowSellModal(true)}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2 rounded-xl text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/30"
                >
                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                  Sell an Item
                </button>
              </div>
            )}

            {/* SEARCH & CATEGORY FILTERS */}
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
              <div className="relative flex-1 w-full sm:max-w-md">
                <i data-lucide="search" className="absolute left-3 top-2.5 h-4 w-4 text-slate-400"></i>
                <input
                  type="text"
                  placeholder="Fast case-insensitive search..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-4 py-2 border rounded-lg text-sm outline-none bg-slate-900 border-slate-800 focus:border-indigo-500"
                />
              </div>

              <select
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
                className="bg-slate-900 border border-slate-800 text-sm rounded-lg px-3 py-2 outline-none w-full sm:w-auto"
              >
                <option value="All">All Categories</option>
                <option value="Textbooks">Textbooks</option>
                <option value="Electronics">Electronics</option>
                <option value="Lab Supplies">Lab Supplies</option>
                <option value="Essentials">Essentials</option>
                <option value="Others">Others</option>
                <option value="Cheaper than your College">Cheaper than your College</option>
              </select>
            </div>

            {/* PRODUCT LISTINGS GRID */}
            {filteredListings.length === 0 ? (
              <div className="text-center py-16 rounded-2xl border bg-slate-900 border-slate-800">
                <p className="text-slate-500">No items found matching your search.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredListings.map((item) => {
                  const isWishlisted = wishlist.includes(item.id);
                  return (
                    <div key={item.id} className="image-card-container rounded-xl overflow-hidden border transition flex flex-col bg-slate-900 border-slate-800">
                      <div className="relative h-48 w-full bg-slate-800 overflow-hidden">
                        <img src={item.image_url} alt={item.title} className="image-card-hover w-full h-full object-cover" />
                        {item.status === 'sold' && (
                          <div className="absolute inset-0 bg-black/75 flex items-center justify-center">
                            <span className="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">SOLD</span>
                          </div>
                        )}
                        <button
                          onClick={() => toggleWishlist(item.id, item.title)}
                          className="absolute top-2 right-2 p-2 rounded-full bg-slate-900/80 hover:bg-slate-900 text-white transition z-10"
                        >
                          <i data-lucide="heart" className={`w-4 h-4 ${isWishlisted ? 'fill-rose-400 text-rose-400' : 'text-slate-300'}`}></i>
                        </button>
                      </div>

                      <div className="p-5 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start mb-2">
                            <h3 className="font-semibold text-slate-100">{item.title}</h3>
                            <span className="font-bold text-indigo-400">₹{item.price}</span>
                          </div>
                          <p className="text-xs text-slate-400 line-clamp-2 mb-4">{item.description}</p>
                        </div>

                        <div className="flex items-center justify-between border-t border-slate-800 pt-3">
                          <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400">
                            <i data-lucide="tag" className="w-3 h-3"></i>
                            {item.category}
                          </span>

                          {/* ACTION BUTTONS (SELLER STATUS ONLY IN ESCAPED PAGE) */}
                          {activePage === 'escaped' && item.isMine ? (
                            <button
                              onClick={() => toggleStatus(item.id)}
                              className={`text-xs font-medium px-2.5 py-1 rounded transition flex items-center gap-1 ${
                                item.status === 'available' ? 'text-amber-300 bg-amber-500/20' : 'text-emerald-300 bg-emerald-500/20'
                              }`}
                            >
                              <i data-lucide="check-circle-2" className="w-3 h-3"></i>
                              Mark {item.status === 'available' ? 'Sold' : 'Available'}
                            </button>
                          ) : (
                            <button
                              onClick={() => triggerCelebration(`Buy Order Initiated for "${item.title}"! You are already better than the college you study in! 🛍️🎉`)}
                              className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-md font-medium"
                            >
                              Buy Now
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* FLOATING MY ORDERS MODAL (CLOSES ON CLICK OUTSIDE) */}
          {showOrdersModal && (
            <div 
              ref={ordersModalRef}
              onClick={(e) => handleModalBackdropClick(e, ordersModalRef, () => setShowOrdersModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-6 text-white">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="shopping-bag" className="w-5 h-5 text-amber-400"></i>
                    My Orders & Financial Summary
                  </h3>
                  <button onClick={() => setShowOrdersModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                    <p className="text-[10px] text-slate-400 uppercase font-bold">Total Sales Earned</p>
                    <p className="text-2xl font-extrabold text-emerald-400 mt-1">₹{totalEarned}</p>
                  </div>
                  <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                    <p className="text-[10px] text-slate-400 uppercase font-bold">Purchases Completed</p>
                    <p className="text-2xl font-extrabold text-indigo-400 mt-1">₹1,150</p>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Sold Items ({soldItems.length})</h4>
                  {soldItems.length === 0 ? (
                    <p className="text-xs text-slate-500">No sold orders recorded yet.</p>
                  ) : (
                    <div className="space-y-2 max-h-40 overflow-y-auto">
                      {soldItems.map(i => (
                        <div key={i.id} className="flex justify-between items-center bg-slate-800/40 p-2 rounded text-xs">
                          <span>{i.title}</span>
                          <span className="font-bold text-emerald-400">+₹{i.price}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* SELL AN ITEM MODAL (CLOSES ON CLICK OUTSIDE) */}
          {showSellModal && (
            <div 
              ref={sellModalRef}
              onClick={(e) => handleModalBackdropClick(e, sellModalRef, () => setShowSellModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-white">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold">Sell an Item</h2>
                  <button onClick={() => setShowSellModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddListing} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium mb-1">Product Title</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Data Structures Textbook"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium mb-1">Category</label>
                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm outline-none"
                      >
                        <option value="Textbooks">Textbooks</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Lab Supplies">Lab Supplies</option>
                        <option value="Essentials">Essentials</option>
                        <option value="Others">Others</option>
                        <option value="Cheaper than your College">Cheaper than your College</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">Price (₹)</label>
                      <input
                        type="number"
                        required
                        placeholder="499"
                        value={formPrice}
                        onChange={(e) => setFormPrice(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium mb-1">Attach Image (JPG / PNG)</label>
                    <input
                      type="file"
                      accept="image/png, image/jpeg, image/jpg"
                      onChange={handleImageUpload}
                      className="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-medium">Description</label>
                      <button
                        type="button"
                        onClick={handleGenerateAI}
                        disabled={isGenerating}
                        className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium"
                      >
                        <i data-lucide="sparkles" className="w-3 h-3"></i>
                        {isGenerating ? 'Generating...' : 'Auto-Generate with AI'}
                      </button>
                    </div>
                    <textarea
                      rows={3}
                      required
                      value={formDesc}
                      onChange={(e) => setFormDesc(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm outline-none"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowSellModal(false)}
                      className="px-4 py-1.5 text-sm text-slate-400 hover:bg-slate-800 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-sm bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium"
                    >
                      Publish Listing
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* INCOGNITO STEALTH MODE TOGGLE (BOTTOM RIGHT CORNER) */}
          <div className="fixed bottom-4 right-4 z-40">
            <button
              onClick={() => {
                setIsIncognito(!isIncognito);
                triggerToast(isIncognito ? 'Exited Incognito Mode' : '🕵️‍♂️ Incognito Secret Mode Enabled!');
              }}
              className={`px-3 py-2 rounded-full text-xs font-bold border shadow-2xl flex items-center gap-2 transition ${
                isIncognito ? 'bg-rose-950 border-rose-700 text-rose-300' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'
              }`}
            >
              <i data-lucide="eye-off" className="w-4 h-4 text-rose-400"></i>
              <span>{isIncognito ? 'Exit Incognito Mode' : 'Incognito Mode 🕵️‍♂️'}</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

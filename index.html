    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    /* 🏹 Left-Pointing Mirror Bow Emoji Cursor */
    body, button, input, select, textarea, a, div {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g transform='scale(-1, 1) translate(-24, 0)'><text y='18' font-size='18'>🏹</text></g></svg>") 0 0, auto !important;
      -webkit-tap-highlight-color: transparent;
    }
 
    /* 🏹 Smooth Fast Arrow Flying Animation targeting top pop-up banner */
    .arrow-flying-celebration {
      position: fixed;
      z-index: 9999;
      font-size: 32px;
      pointer-events: none;
      animation: circularFlyToPop 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
 
    @keyframes circularFlyToPop {
      0% { top: 75%; left: 50%; transform: rotate(0deg) scale(1.2); opacity: 1; }
      30% { top: 45%; left: 70%; transform: rotate(120deg) scale(1); opacity: 1; }
      60% { top: 25%; left: 30%; transform: rotate(240deg) scale(0.9); opacity: 1; }
      90% { top: 12%; left: 50%; transform: rotate(360deg) scale(0.8); opacity: 1; }
      100% { top: 8%; left: 50%; transform: rotate(360deg) scale(0.1); opacity: 0; }
    }
 
    /* Full Page Explosion Shockwave CSS Animation */
    .explosion-shockwave {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background: radial-gradient(circle, rgba(245,158,11,0.5) 0%, rgba(99,102,241,0.3) 40%, rgba(16,185,129,0.2) 70%, rgba(0,0,0,0) 90%);
      animation: shockwavePulse 0.9s ease-out forwards;
    }
 
    @keyframes shockwavePulse {
      0% { transform: scale(0.1); opacity: 1; }
      50% { opacity: 0.9; }
      100% { transform: scale(2.8); opacity: 0; }
    }
 
    /* Image Hover Outline Effect */
    .image-card-hover {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .image-card-container:hover .image-card-hover {
      transform: scale(1.08);
    }
    .image-card-container:hover {
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.7);

    /* Hide Scrollbar for Horizontal Nav on Mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    // Safe Lucide wrapper: React only owns the empty <span>; Lucide draws inside it.
    function Icon({ name, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0"></span>;

    // Quantity-Based SVG Bar Chart Component
    function QuantityBarChart({ data, dataKey, color }) {
      const maxValue = Math.max(...data.map(d => d[dataKey])) || 1;
      return (
        <div className="w-full h-36 sm:h-40 flex items-end justify-between gap-2 sm:gap-3 pt-6 pb-2 px-1">
          {data.map((item, idx) => {
            const heightPct = Math.round((item[dataKey] / maxValue) * 100);
            return (
              <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative">
                <div className="text-[10px] text-amber-500 mb-1 opacity-0 group-hover:opacity-100 transition font-bold">
                  {item[dataKey]}

                <div 
                  style={{ height: `${Math.max(heightPct, 10)}%`, backgroundColor: color }}

                <span className="text-[9px] sm:text-[10px] text-slate-400 mt-2 truncate w-full text-center">
                  {item.name}
                </span>
              </div>
            );
          })}
        </div>
      );

      // Firebase Auth State
      const [currentUser, setCurrentUser] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      // Junior Uniform Timer (1 Min)

      const [timerSeconds, setTimerSeconds] = useState(60);
 
      // Create Sell Modal State

      const [formCategory, setFormCategory] = useState('Textbooks');
      const [formPrice, setFormPrice] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formStock, setFormStock] = useState('5');
      const [formImage, setFormImage] = useState(FALLBACK_IMAGE);
      const [formIsIncognito, setFormIsIncognito] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
 
      // Celebration Animation & Shockwave State
      const [celebrationMsg, setCelebrationMsg] = useState('');
      const [isArrowFlying, setIsArrowFlying] = useState(false);
      const [showShockwave, setShowShockwave] = useState(false);
 
      // Floating Profile Popover State
      const [showProfileHover, setShowProfileHover] = useState(false);
 
      const ordersModalRef = useRef();
      const buyConfirmModalRef = useRef();
      const sellModalRef = useRef();
 
      // Firebase Auth Listener
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          if (user) {
            setCurrentUser(user);
            setShowUniformTimer(true);
          } else {
            setCurrentUser(null);
          }
        });
        return () => unsubscribe();
      }, []);
 
      // Live Clock & Weather Fetch
      useEffect(() => {
        const updateTime = () => setTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        updateTime();
        const timer = setInterval(updateTime, 1000);
 
        const fetchWeather = async () => {
          try {
            if (!WEATHER_API_KEY) {
              setWeather({ temp: 24, condition: 'Sunny' });
              return;
            }
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Bengaluru&units=metric&appid=${WEATHER_API_KEY}`);
            const data = await res.json();
            if (data.main) {
              setWeather({ temp: Math.round(data.main.temp), condition: data.weather[0].main });
            }
          } catch {
            setWeather({ temp: 24, condition: 'Sunny' });
          }
        };
 
        fetchWeather();
        return () => clearInterval(timer);
      }, []);
 
      // 1-Minute Junior Uniform Timer
      useEffect(() => {
        if (currentUser && showUniformTimer) {
          const interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                setShowUniformTimer(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }
      }, [currentUser, showUniformTimer]);
 
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };
 
      // CELEBRATION FLOW: Immediate Banner -> Arrow Arc -> Banner Pop & Shockwave
      const triggerArrowExplosion = (msg) => {
        setCelebrationMsg(msg);
        setIsArrowFlying(true);
        
        setTimeout(() => {
          setIsArrowFlying(false);
          setShowShockwave(true);
          if (window.confetti) {
            window.confetti({ particleCount: 220, spread: 120, origin: { y: 0.35 } });
          }
          setTimeout(() => setShowShockwave(false), 900);
          setTimeout(() => setCelebrationMsg(''), 4500);
        }, 1200);
      };
 
      // RESET STATE GUARD: Prevents blank screens when navigating tabs
      const resetFiltersAndNavigate = (page) => {
        setSearchQuery('');
        setSelectedCategory('All');
        setShowSwipeView(false);
        setActivePage(page);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
 
      const handleBrandClick = () => {
        setIsIncognito(false);
        resetFiltersAndNavigate('explore');
      };
 
      // Firebase Authentication Logic
      const handleFirebaseAuth = async (e) => {
        e.preventDefault();
        try {
          if (authMode === 'reset') {
            await auth.sendPasswordResetEmail(email);
            triggerToast('Password reset link sent to your email!');
            setAuthMode('login');
            return;
          }
 
          try {
            await auth.signInWithEmailAndPassword(email, password);
            triggerToast('Welcome back to Escape the Matrix!');
          } catch (signInErr) {
            if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential') {
              await auth.createUserWithEmailAndPassword(email, password);
              triggerToast('Account created and logged in!');
            } else {
              throw signInErr;
            }
          }
        } catch (err) {
          alert(err.message);
        }
      };
 
      const handleLogout = () => {
        auth.signOut();
        setCurrentUser(null);
        triggerToast('Logged out successfully.');
      };
 
      const toggleWishlist = (id, title) => {
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(item => item !== id));
          triggerToast(`Removed "${title}"`);
        } else {
          setWishlist([...wishlist, id]);
          triggerToast(`❤️ Added "${title}" to My Favorites!`);
        }
      };
 
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormImage(reader.result);
          reader.readAsDataURL(file);
        }
      };
 
      const handleGenerateAI = async () => {
        if (!formTitle) return alert('Please enter a product title first!');
        setIsGenerating(true);
        try {
          if (!GEMINI_API_KEY) {
            setTimeout(() => {
              setFormDesc(`Pristine condition ${formTitle} under ${formCategory}. Essential campus item on Escape the Matrix!`);
              setIsGenerating(false);
            }, 600);
            return;
          }
          const prompt = `Write a concise 3-sentence marketplace description for "${formTitle}" in category "${formCategory}".`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          setFormDesc(data?.candidates?.[0]?.content?.parts?.[0]?.text || `High quality ${formTitle} for students!`);
        } catch {
          alert('Failed to generate description.');
        } finally {
          setIsGenerating(false);
        }
      };
 
      // Add New Product
      const handleAddListing = (e) => {
        e.preventDefault();
        const userNameClean = currentUser?.email?.split('@')[0] || 'Student Seller';
        const newListing = {
          id: Date.now().toString(),
          title: formTitle,
          category: formCategory,
          price: parseFloat(formPrice),
          description: formDesc,
          status: 'available',
          stock: parseInt(formStock) || 5,
          image_url: formImage || FALLBACK_IMAGE,
          sellerName: userNameClean,
          sellerEmail: currentUser?.email || 'student@university.edu',
          isIncognito: formIsIncognito,
          isMine: true
        };
 
        if (formIsIncognito) {
          incognitoListings.unshift(newListing);
        } else {
          setListings([newListing, ...listings]);
        }
 
        setShowSellModal(false);
        setFormTitle('');
        setFormPrice('');
        setFormDesc('');
        resetFiltersAndNavigate('explore');
        triggerArrowExplosion(`Listing Published by ${userNameClean}! Added immediately to Explore Feed! 🎓🚀`);
      };
 
      // Toggle Sold Status
      const toggleStatus = (id) => {
        setListings(listings.map(item => item.id === id ? { ...item, status: item.status === 'available' ? 'sold' : 'available' } : item));

                            <div>
                              <div className="flex justify-between items-start mb-1.5 gap-2">
                                <h3 className="font-semibold text-xs sm:text-sm line-clamp-1">{item.title}</h3>
                                <span className="font-bold text-amber-500 text-xs sm:text-sm shrink-0">₹{item.price}</span>
                              </div>
                              <p className="text-[11px] sm:text-xs text-slate-400 line-clamp-2 mb-3">{item.description}</p>
                              
                              <div className="flex justify-between items-center text-[10px] sm:text-[11px] text-indigo-400 mb-3 bg-indigo-950/30 p-2 rounded-lg border border-indigo-900/30">
                                <span className="truncate">👤 {item.sellerName}</span>
                                <span className={`font-bold shrink-0 ${isOutOfStock ? 'text-rose-400' : 'text-emerald-400'}`}>
                                  {isOutOfStock ? 'Out of Stock' : `${item.stock} left`}
                                </span>
                              </div>
                            </div>
 
                            <div className="flex items-center justify-between border-t border-slate-800 pt-3 mt-auto">
                              <span className={`inline-flex items-center gap-1 text-[10px] sm:text-xs px-2 py-0.5 rounded ${darkMode ? 'bg-slate-800 text-slate-400' : 'bg-slate-200 text-slate-600'}`}>
                                <Icon name="tag" className="w-3 h-3" />
                                {item.category}
                              </span>
 
                              {activePage === 'escaped' ? (
                                <button
                                  onClick={() => toggleStatus(item.id)}
                                  className={`text-xs font-medium px-2.5 py-1 rounded transition flex items-center gap-1 ${
                                    item.status === 'available' ? 'text-amber-400 bg-amber-500/20' : 'text-emerald-400 bg-emerald-500/20'
                                  }`}
                                >
                                  <Icon name="check-circle-2" className="w-3 h-3" />
                                  Mark {item.status === 'available' ? 'Sold' : 'Available'}
                                </button>
                              ) : (
                                <button
                                  onClick={() => { setSelectedBuyItem(item); setShowBuyConfirmModal(true); }}
                                  disabled={isOutOfStock}
                                  className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${
                                    isOutOfStock 
                                      ? 'bg-slate-800 text-slate-500 cursor-not-allowed' 
                                      : 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-md shadow-amber-500/20'
                                  }`}
                                >
                                  {isOutOfStock ? 'Out of Stock' : 'Buy Now'}
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </>
            )}
          </main>
 
          {/* BUY CONFIRMATION POPUP */}
          {showBuyConfirmModal && selectedBuyItem && (
            <div 
              ref={buyConfirmModalRef}
              onClick={(e) => handleModalBackdropClick(e, buyConfirmModalRef, () => setShowBuyConfirmModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-white space-y-4">
                <h3 className="text-lg font-bold text-amber-400">Confirm Buy Order</h3>
                <p className="text-xs text-slate-300">
                  Are you sure you want to purchase <span className="font-bold text-white">"{selectedBuyItem.title}"</span> for <span className="font-bold text-emerald-400">₹{selectedBuyItem.price}</span> from {selectedBuyItem.sellerName}?
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowBuyConfirmModal(false)} className="px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-800 rounded">
                    Cancel
                  </button>
                  <button onClick={confirmBuyOrder} className="px-4 py-1.5 text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 rounded font-bold">
                    Confirm Purchase
                  </button>
                </div>
              </div>
            </div>
          )}
 
          {/* FLOATING MY ORDERS MODAL */}
          {showOrdersModal && (
            <div 
              ref={ordersModalRef}
              onClick={(e) => handleModalBackdropClick(e, ordersModalRef, () => setShowOrdersModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-6 text-white max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base sm:text-lg font-bold flex items-center gap-2">
                    <Icon name="shopping-bag" className="w-5 h-5 text-amber-400" />
                    My Orders & Financial Summary
                  </h3>
                  <button onClick={() => setShowOrdersModal(false)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
 
                <div className="grid grid-cols-2 gap-3 sm:gap-4">
                  <div className="bg-slate-800/80 p-3.5 sm:p-4 rounded-xl border border-slate-700">
                    <p className="text-[10px] text-slate-400 uppercase font-bold">Total Sales Earned</p>
                    <p className="text-xl sm:text-2xl font-extrabold text-emerald-400 mt-1">₹{totalEarned}</p>
                  </div>
                  <div className="bg-slate-800/80 p-3.5 sm:p-4 rounded-xl border border-slate-700">
                    <p className="text-[10px] text-slate-400 uppercase font-bold">Purchases Completed</p>
                    <p className="text-xl sm:text-2xl font-extrabold text-amber-400 mt-1">₹1,150</p>
                  </div>
                </div>
 
                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Sold Items ({soldItems.length})</h4>
                  {soldItems.length === 0 ? (
                    <p className="text-xs text-slate-500">No sold orders recorded yet.</p>
                  ) : (
                    <div className="space-y-2 max-h-40 overflow-y-auto">
                      {soldItems.map(i => (
                        <div key={i.id} className="flex justify-between items-center bg-slate-800/40 p-2 rounded text-xs">
                          <span className="truncate max-w-[200px]">{i.title}</span>
                          <span className="font-bold text-emerald-400 shrink-0">+₹{i.price}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
 
          {/* SELL AN ITEM MODAL */}
          {showSellModal && (
            <div 
              ref={sellModalRef}
              onClick={(e) => handleModalBackdropClick(e, sellModalRef, () => setShowSellModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl text-white max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-base sm:text-lg font-bold">Sell an Item</h2>
                  <button onClick={() => setShowSellModal(false)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
 
                <form onSubmit={handleAddListing} className="space-y-4">
                  <div className="bg-slate-800 p-1.5 rounded-xl flex items-center justify-between text-xs">
                    <span className="font-semibold text-slate-300">Listing Mode:</span>
                    <div className="flex gap-1">
                      <button
                        type="button"
                        onClick={() => setFormIsIncognito(false)}
                        className={`px-3 py-1 rounded-lg transition ${!formIsIncognito ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}
                      >
                        General
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormIsIncognito(true)}
                        className={`px-3 py-1 rounded-lg transition ${formIsIncognito ? 'bg-rose-600 text-white font-bold' : 'text-slate-400'}`}
                      >
                        Incognito 🕵️‍♂️
                      </button>
                    </div>
                  </div>
 
                  <div>
                    <label className="block text-xs font-medium mb-1">Product Title</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Data Structures Textbook"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs sm:text-sm outline-none"
                    />
                  </div>
 
                  <div className="grid grid-cols-3 gap-2.5 sm:gap-3">
                    <div>
                      <label className="block text-xs font-medium mb-1">Category</label>
                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-1.5 py-1.5 text-xs sm:text-sm outline-none"
                      >
                        <option value="Textbooks">Textbooks</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Lab Supplies">Lab Supplies</option>
                        <option value="Essentials">Essentials</option>
                        <option value="Others">Others</option>
                        <option value="Cheaper than your College">Cheaper than your College</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">Price (₹)</label>
                      <input
                        type="number"
                        required
                        placeholder="499"
                        value={formPrice}
                        onChange={(e) => setFormPrice(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">Stock Qty</label>
                      <input
                        type="number"
                        required
                        placeholder="5"
                        value={formStock}
                        onChange={(e) => setFormStock(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm outline-none"
                      />
                    </div>
                  </div>
 
                  <div>
                    <label className="block text-xs font-medium mb-1">Attach Image (JPG / PNG)</label>
                    <input
                      type="file"
                      accept="image/png, image/jpeg, image/jpg"
                      onChange={handleImageUpload}
                      className="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400"
                    />
                  </div>
 
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-medium">Description</label>
                      <button
                        type="button"
                        onClick={handleGenerateAI}
                        disabled={isGenerating}
                        className="text-[11px] text-amber-400 hover:text-amber-300 flex items-center gap-1 font-medium"
                      >
                        <Icon name="sparkles" className="w-3 h-3" />
                        {isGenerating ? 'Generating...' : 'Auto-Generate with AI'}
                      </button>
                    </div>
                    <textarea
                      rows={3}
                      required
                      value={formDesc}
                      onChange={(e) => setFormDesc(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs sm:text-sm outline-none"
                    ></textarea>
                  </div>
 
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowSellModal(false)}
                      className="px-4 py-1.5 text-xs sm:text-sm text-slate-400 hover:bg-slate-800 rounded-lg"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-xs sm:text-sm bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium"
                    >
                      Publish Listing
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
 
          {/* INCOGNITO STEALTH TOGGLE */}
          <div className="fixed bottom-4 right-4 z-40">
            <button
              onClick={() => {
                setIsIncognito(!isIncognito);
                triggerToast(isIncognito ? 'Exited Incognito Mode' : '🕵️‍♂️ Incognito Secret Mode Enabled!');
              }}
              className={`px-3 py-2 rounded-full text-xs font-bold border shadow-2xl flex items-center gap-2 transition ${
                isIncognito ? 'bg-rose-950 border-rose-700 text-rose-300' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'
              }`}
            >
              <Icon name="eye-off" className="w-4 h-4 text-rose-400" />
              <span>{isIncognito ? 'Exit Incognito' : 'Incognito 🕵️‍♂️'}</span>
            </button>
          </div>
 
        </div>
      );
    }
 
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

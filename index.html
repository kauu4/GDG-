<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape the Matrix | Campus Marketplace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase App & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    /* 🏹 Left-Pointing Mirror Bow Emoji Cursor */
    body, button, input, select, textarea, a, div {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><g transform='scale(-1, 1) translate(-24, 0)'><text y='18' font-size='18'>🏹</text></g></svg>") 0 0, auto !important;
    }

    /* Arrow Shooting Animation towards Pop-up */
    .arrow-flying-celebration {
      position: fixed;
      z-index: 9999;
      font-size: 28px;
      pointer-events: none;
      animation: flyAround 7s ease-in-out forwards;
    }

    @keyframes flyAround {
      0% { top: 80%; left: 50%; transform: rotate(0deg) scale(1); }
      20% { top: 20%; left: 80%; transform: rotate(45deg) scale(1.2); }
      40% { top: 70%; left: 10%; transform: rotate(-90deg) scale(1.1); }
      60% { top: 30%; left: 30%; transform: rotate(180deg) scale(1.3); }
      80% { top: 60%; left: 70%; transform: rotate(90deg) scale(1.2); }
      90% { top: 40%; left: 50%; transform: rotate(0deg) scale(1.5); }
      100% { top: 20%; left: 50%; transform: scale(2) rotate(360deg); opacity: 0; }
    }

    /* Image Hover Outline Effect */
    .image-card-hover {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .image-card-container:hover .image-card-hover {
      transform: scale(1.08);
    }
    .image-card-container:hover {
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.7);
      border-color: #6366f1;
    }
  </style>
</head>
<body class="antialiased">

  <div id="root"></div>

  <!-- FIREBASE INITIALIZATION SCRIPT -->
  <script>
    // Replace with your actual Firebase Web Config details from Firebase Console
    const firebaseConfig = {
        apiKey: "AIzaSyAJwzQOqGYYV1YKgfvyuknrzrCOrI6OXYc",
  authDomain: "escape-the-matrix-76050.firebaseapp.com",
  projectId: "escape-the-matrix-76050",
  storageBucket: "escape-the-matrix-76050.firebasestorage.app",
  messagingSenderId: "862745449376",
  appId: "1:862745449376:web:7e147198e47b268ddd0ac5",
  measurementId: "G-4884XYRRF3"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GEMINI_API_KEY = ""; 
    const WEATHER_API_KEY = ""; 

    // Quantity-Based SVG Bar Chart Component
    function QuantityBarChart({ data, dataKey, color }) {
      const maxValue = Math.max(...data.map(d => d[dataKey]));
      return (
        <div className="w-full h-40 flex items-end justify-between gap-3 pt-6 pb-2 px-2">
          {data.map((item, idx) => {
            const heightPct = Math.round((item[dataKey] / maxValue) * 100);
            return (
              <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative">
                <div className="text-[10px] text-indigo-400 mb-1 opacity-0 group-hover:opacity-100 transition font-bold">
                  {item[dataKey]} Units
                </div>
                <div 
                  style={{ height: `${heightPct}%`, backgroundColor: color }}
                  className="w-full rounded-t-md transition-all duration-500 hover:brightness-125"
                ></div>
                <span className="text-[10px] text-slate-400 mt-2 truncate w-full text-center">
                  {item.name}
                </span>
              </div>
            );
          })}
        </div>
      );
    }

    const quantityAnalyticsData = [
      { name: 'Escape Matrix', sellQty: 185, buyQty: 210 },
      { name: 'Headphones', sellQty: 120, buyQty: 150 },
      { name: 'USB Charger', sellQty: 98, buyQty: 130 },
      { name: 'DSA Textbook', sellQty: 86, buyQty: 110 },
      { name: 'Graphing Calc', sellQty: 72, buyQty: 95 }
    ];

    const initialListings = [
      { id: '1', title: 'Escape the Matrix', description: 'Ultimate campus survival & productivity guide book.', price: 499, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500', sellerName: 'Kaustav (Core Member)', sellerEmail: 'kaustav@university.edu', isIncognito: false },
      { id: '2', title: 'Data Structures & Algorithms', description: 'Core CS concepts textbook with C/C++ examples.', price: 550, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=500', sellerName: 'Senior Student', sellerEmail: 'senior@university.edu', isIncognito: false },
      { id: '3', title: 'Sony Over-Ear Headphones', description: 'Noise-canceling deep bass study headphones.', price: 2499, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500', sellerName: 'Alex CS', sellerEmail: 'alex@university.edu', isIncognito: false },
      { id: '4', title: 'Casio FX-991EX Scientific Calculator', description: 'Exam approved non-programmable calculator.', price: 1250, category: 'Cheaper than your College', status: 'available', image_url: 'https://images.unsplash.com/photo-1611117775350-ac3950990985?w=500', sellerName: 'Rahul (COSMOS)', sellerEmail: 'rahul@university.edu', isIncognito: false },
    ];

    const incognitoListings = [
      { id: 'inc-1', title: 'Secret Vape Pod Mod 5000', description: 'Discreet rechargeable flavor pod.', price: 1200, category: 'Incognito Special', image_url: 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=500', sellerName: 'Anonymous Seller', isIncognito: true },
      { id: 'inc-2', title: 'Stealth Black Undergarments 3-Pack', description: 'Unmarked plain delivery box.', price: 899, category: 'Incognito Special', image_url: 'https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500', sellerName: 'Anonymous Seller', isIncognito: true }
    ];

    function App() {
      // Firebase Auth & User State
      const [currentUser, setCurrentUser] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'reset'

      // Global Shared Database Listings State
      const [listings, setListings] = useState(initialListings);
      const [wishlist, setWishlist] = useState([]);

      // UI Modes & Navigation
      const [darkMode, setDarkMode] = useState(true);
      const [activePage, setActivePage] = useState('explore'); // 'explore' | 'escaped'
      const [showOrdersModal, setShowOrdersModal] = useState(false);
      const [showBuyConfirmModal, setShowBuyConfirmModal] = useState(false);
      const [selectedBuyItem, setSelectedBuyItem] = useState(null);
      const [isIncognito, setIsIncognito] = useState(false);

      // Filters & Search
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [wishlistName, setWishlistName] = useState('My Favorites');
      const [toastMessage, setToastMessage] = useState('');

      // Junior Uniform Timer (1 Min)
      const [showUniformTimer, setShowUniformTimer] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(60);

      // Create Sell Modal State
      const [showSellModal, setShowSellModal] = useState(false);
      const [formTitle, setFormTitle] = useState('');
      const [formCategory, setFormCategory] = useState('Textbooks');
      const [formPrice, setFormPrice] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formImage, setFormImage] = useState('https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500');
      const [formIsIncognito, setFormIsIncognito] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);

      // Celebration Animation State
      const [celebrationMsg, setCelebrationMsg] = useState('');
      const [isArrowFlying, setIsArrowFlying] = useState(false);

      // Floating Profile Popover State
      const [showProfileHover, setShowProfileHover] = useState(false);

      const ordersModalRef = useRef();
      const buyConfirmModalRef = useRef();
      const sellModalRef = useRef();

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Firebase Auth Listener (Persistent Login Check)
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          if (user) {
            setCurrentUser(user);
            setShowUniformTimer(true);
          } else {
            setCurrentUser(null);
          }
        });
        return () => unsubscribe();
      }, []);

      // 1-Minute Junior Uniform Timer
      useEffect(() => {
        if (currentUser && showUniformTimer) {
          const interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                setShowUniformTimer(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }
      }, [currentUser, showUniformTimer]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // Arrow Flying Animation (7 Seconds) & Party Confetti Burst
      const triggerArrowCelebration = (msg) => {
        setIsArrowFlying(true);
        setTimeout(() => {
          setIsArrowFlying(false);
          setCelebrationMsg(msg);
          if (window.confetti) {
            window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
          }
          setTimeout(() => setCelebrationMsg(''), 4500);
        }, 7000);
      };

      // Firebase Authentication Logic
      const handleFirebaseAuth = async (e) => {
        e.preventDefault();
        try {
          if (authMode === 'reset') {
            await auth.sendPasswordResetEmail(email);
            triggerToast('Password reset link sent to your email!');
            setAuthMode('login');
            return;
          }

          // Try signing in; if user doesn't exist, register them
          try {
            await auth.signInWithEmailAndPassword(email, password);
            triggerToast('Welcome back to Escape the Matrix!');
          } catch (signInErr) {
            if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential') {
              await auth.createUserWithEmailAndPassword(email, password);
              triggerToast('Account created and logged in!');
            } else {
              throw signInErr;
            }
          }
        } catch (err) {
          alert(err.message);
        }
      };

      const handleLogout = () => {
        auth.signOut();
        setCurrentUser(null);
        triggerToast('Logged out successfully.');
      };

      const toggleWishlist = (id, title) => {
        if (wishlist.includes(id)) {
          setWishlist(wishlist.filter(item => item !== id));
          triggerToast(`Removed "${title}"`);
        } else {
          setWishlist([...wishlist, id]);
          triggerToast(`❤️ Added "${title}" to ${wishlistName}!`);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleGenerateAI = async () => {
        if (!formTitle) return alert('Please enter a product title first!');
        setIsGenerating(true);
        try {
          if (!GEMINI_API_KEY) {
            setTimeout(() => {
              setFormDesc(`Pristine condition ${formTitle} under ${formCategory}. Essential campus item on Escape the Matrix!`);
              setIsGenerating(false);
            }, 600);
            return;
          }
          const prompt = `Write a concise 3-sentence marketplace description for "${formTitle}" in category "${formCategory}".`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          setFormDesc(data?.candidates?.[0]?.content?.parts?.[0]?.text || `High quality ${formTitle} for students!`);
        } catch {
          alert('Failed to generate description.');
        } finally {
          setIsGenerating(false);
        }
      };

      // Add New Product (Visible to All Users)
      const handleAddListing = (e) => {
        e.preventDefault();
        const newListing = {
          id: Date.now().toString(),
          title: formTitle,
          category: formCategory,
          price: parseFloat(formPrice),
          description: formDesc,
          status: 'available',
          image_url: formImage,
          sellerName: currentUser?.email?.split('@')[0] || 'Student Seller',
          sellerEmail: currentUser?.email || 'student@university.edu',
          isIncognito: formIsIncognito,
          isMine: true
        };

        if (formIsIncognito) {
          incognitoListings.unshift(newListing);
        } else {
          setListings([newListing, ...listings]);
        }

        setShowSellModal(false);
        setFormTitle('');
        setFormPrice('');
        setFormDesc('');
        triggerArrowCelebration(`Listing Published! You are already better than the college you study in! 🎓🚀`);
      };

      // Toggle Sold Status
      const toggleStatus = (id) => {
        setListings(listings.map(item => item.id === id ? { ...item, status: item.status === 'available' ? 'sold' : 'available' } : item));
        triggerArrowCelebration(`Item Status Updated! You are already better than the college you study in! 🎉`);
      };

      // Confirm Buy Order
      const confirmBuyOrder = () => {
        if (!selectedBuyItem) return;
        setListings(listings.map(item => item.id === selectedBuyItem.id ? { ...item, status: 'sold' } : item));
        setShowBuyConfirmModal(false);
        triggerArrowCelebration(`Buy Order Finalized for "${selectedBuyItem.title}"! You are already better than the college you study in! 🛍️🎉`);
      };

      // Click Outside Modal Close Handler
      const handleModalBackdropClick = (e, ref, closeFn) => {
        if (ref.current && e.target === ref.current) closeFn();
      };

      const myProducts = listings.filter(item => item.isMine || item.sellerEmail === currentUser?.email);
      const soldItems = myProducts.filter(item => item.status === 'sold');
      const totalEarned = soldItems.reduce((sum, item) => sum + item.price, 0);

      // Search & Filters
      const currentDataset = isIncognito ? incognitoListings : listings;
      const filteredListings = currentDataset.filter(item => {
        const query = searchQuery.toLowerCase().trim();
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              item.description.toLowerCase().includes(query) ||
                              item.category.toLowerCase().includes(query);
        const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
        const matchesPageFilter = activePage === 'escaped' ? (item.isMine || item.sellerEmail === currentUser?.email) : true;
        return matchesSearch && matchesCategory && matchesPageFilter;
      });

      // FIREBASE AUTH / FORGOT PASSWORD GATE
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
              <div className="text-center mb-8">
                <div className="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-3">
                  <i data-lucide="zap" className="w-8 h-8"></i>
                </div>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                  Escape the Matrix
                </h1>
                <p className="text-slate-400 text-xs mt-1">
                  {authMode === 'reset' ? 'Password Reset Window' : 'Firebase Authentication Portal'}
                </p>
              </div>

              <form onSubmit={handleFirebaseAuth} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                  <input
                    type="email"
                    required
                    placeholder="student@university.edu"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-indigo-500"
                  />
                </div>

                {authMode === 'login' && (
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-indigo-500"
                    />
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-sm text-white transition shadow-lg shadow-indigo-600/30"
                >
                  {authMode === 'reset' ? 'Send Password Reset Link' : 'Login / Register with Firebase'}
                </button>

                <div className="text-center pt-2">
                  {authMode === 'login' ? (
                    <button
                      type="button"
                      onClick={() => setAuthMode('reset')}
                      className="text-xs text-indigo-400 hover:underline"
                    >
                      Forgot password? Click to reset
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => setAuthMode('login')}
                      className="text-xs text-slate-400 hover:underline"
                    >
                      Back to Login
                    </button>
                  )}
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-500 ${isIncognito ? 'bg-black text-rose-100' : darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
          
          {/* FLYING ARROW ANIMATION */}
          {isArrowFlying && <div className="arrow-flying-celebration">🏹</div>}

          {/* PARTY CELEBRATION POPUP */}
          {celebrationMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-gradient-to-r from-emerald-500 via-indigo-600 to-amber-500 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-center animate-bounce border-2 border-white">
              🎉 Congratulations! {celebrationMsg}
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-16 right-5 z-50 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2">
              <i data-lucide="bell" className="w-4 h-4"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* JUNIOR UNIFORM TIMER POPUP */}
          {showUniformTimer && (
            <div className="fixed bottom-4 left-4 z-40 bg-red-950/90 border border-red-700 text-red-200 p-3 rounded-xl shadow-2xl max-w-sm flex items-center gap-3 backdrop-blur-md">
              <span className="text-2xl font-bold text-red-400">{timerSeconds}s</span>
              <div className="text-[11px] leading-tight">
                <p className="font-bold text-white">Sell your uniform here for your juniors otherwise burn it and sell the ashes! 😡🔥👕</p>
              </div>
              <button onClick={() => setShowUniformTimer(false)} className="text-red-400 hover:text-white">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>
          )}

          {/* GLOBAL HEADER */}
          <header className={`sticky top-0 z-30 border-b backdrop-blur ${isIncognito ? 'bg-zinc-950/90 border-rose-950' : darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
              
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActivePage('explore')}>
                <i data-lucide="zap" className="w-7 h-7 text-indigo-400"></i>
                <span className="font-bold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                  Escape the Matrix
                </span>
              </div>

              {/* 3 DISTINCT UN-REPEATED NAVIGATION OPTIONS */}
              <div className="flex items-center gap-1 sm:gap-2 bg-slate-800/80 p-1 rounded-full border border-slate-700 text-xs">
                <button
                  onClick={() => setActivePage('explore')}
                  className={`px-3 py-1.5 rounded-full font-semibold transition ${activePage === 'explore' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  Explore Feed
                </button>

                <button
                  onClick={() => setActivePage('escaped')}
                  className={`px-3 py-1.5 rounded-full font-semibold transition ${activePage === 'escaped' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  Escaped (Stock & Seller)
                </button>

                <button
                  onClick={() => setShowOrdersModal(true)}
                  className="px-3 py-1.5 rounded-full font-semibold text-slate-300 hover:text-white flex items-center gap-1"
                >
                  <i data-lucide="shopping-bag" className="w-3.5 h-3.5 text-amber-400"></i>
                  My Orders
                </button>
              </div>

              {/* RIGHT CONTROLS: THEME TOGGLE & FLOATING PROFILE HOVER */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className={`p-2 rounded-lg border transition ${darkMode ? 'border-slate-800 text-amber-300 hover:bg-slate-800' : 'border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                  title="Toggle Light/Dark Theme"
                >
                  <i data-lucide={darkMode ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>

                {/* FLOATING ROUND PROFILE BUTTON WITH HOVER DROPDOWN */}
                <div 
                  className="relative"
                  onMouseEnter={() => setShowProfileHover(true)}
                  onMouseLeave={() => setShowProfileHover(false)}
                >
                  <button className="w-9 h-9 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center border-2 border-indigo-400 shadow-lg">
                    {currentUser?.email?.[0].toUpperCase() || 'U'}
                  </button>

                  {showProfileHover && (
                    <div className="absolute right-0 top-10 w-56 bg-slate-900 border border-slate-800 text-white rounded-2xl shadow-2xl p-4 space-y-3 z-50 text-xs">
                      <div>
                        <p className="font-bold text-indigo-400">{currentUser?.email?.split('@')[0]}</p>
                        <p className="text-[10px] text-slate-400">{currentUser?.email}</p>
                      </div>
                      <hr className="border-slate-800" />
                      <button onClick={() => alert('Payment Settings: UPI & Campus Gateway Connected')} className="w-full text-left py-1 hover:text-indigo-400 flex items-center gap-2">
                        <i data-lucide="credit-card" className="w-3.5 h-3.5"></i>
                        Payment Settings
                      </button>
                      <button onClick={handleLogout} className="w-full text-left py-1 text-rose-400 hover:underline flex items-center gap-2">
                        <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
                        Logout
                      </button>
                    </div>
                  )}
                </div>
              </div>

            </div>
          </header>

          {/* MAIN PAGE CONTAINER */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            
            {/* TOP QUANTITY ANALYTICS AT TOP OF EXPLORE */}
            {activePage === 'explore' && !isIncognito && (
              <div className="mb-8 space-y-3">
                <div>
                  <h2 className="text-xl font-bold">📊 Top 5 Campus Item Quantities</h2>
                  <p className="text-xs text-slate-400">Live units in circulation and purchase demand</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className={`p-4 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h3 className="text-xs font-bold text-slate-400 uppercase">Top 5 Most Sold Item Quantities</h3>
                    <QuantityBarChart data={quantityAnalyticsData} dataKey="sellQty" color="#6366f1" />
                  </div>

                  <div className={`p-4 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h3 className="text-xs font-bold text-slate-400 uppercase">Top 5 Highest Demanded Quantities</h3>
                    <QuantityBarChart data={quantityAnalyticsData} dataKey="buyQty" color="#10b981" />
                  </div>
                </div>
              </div>
            )}

            {/* ESCAPED PAGE SPECIFIC HEADING & SELL BUTTON */}
            {activePage === 'escaped' && (
              <div className={`mb-8 p-6 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4`}>
                <div>
                  <h2 className="text-2xl font-bold text-emerald-400">Seller World & Stock Portal</h2>
                  <p className="text-xs text-slate-400 mt-1">Track your active listings, manage sold items, and publish new stock.</p>
                </div>
                <button
                  onClick={() => setShowSellModal(true)}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2 rounded-xl text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/30"
                >
                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                  Sell an Item
                </button>
              </div>
            )}

            {/* SEARCH & CATEGORY FILTERS */}
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
              <div className="relative flex-1 w-full sm:max-w-md">
                <i data-lucide="search" className="absolute left-3 top-2.5 h-4 w-4 text-slate-400"></i>
                <input
                  type="text"
                  placeholder="Fast case-insensitive search..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className={`w-full pl-9 pr-4 py-2 border rounded-lg text-sm outline-none ${darkMode ? 'bg-slate-900 border-slate-800 focus:border-indigo-500' : 'bg-white border-slate-200'}`}
                />
              </div>

              <select
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
                className={`border text-sm rounded-lg px-3 py-2 outline-none w-full sm:w-auto ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}
              >
                <option value="All">All Categories</option>
                <option value="Textbooks">Textbooks</option>
                <option value="Electronics">Electronics</option>
                <option value="Lab Supplies">Lab Supplies</option>
                <option value="Essentials">Essentials</option>
                <option value="Others">Others</option>
                <option value="Cheaper than your College">Cheaper than your College</option>
              </select>
            </div>

            {/* PRODUCT LISTINGS GRID */}
            {filteredListings.length === 0 ? (
              <div className={`text-center py-16 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <p className="text-slate-500">No items found matching your search.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredListings.map((item) => {
                  const isWishlisted = wishlist.includes(item.id);
                  return (
                    <div key={item.id} className={`image-card-container rounded-xl overflow-hidden border transition flex flex-col ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                      <div className="relative h-48 w-full bg-slate-800 overflow-hidden">
                        <img src={item.image_url} alt={item.title} className="image-card-hover w-full h-full object-cover" />
                        {item.status === 'sold' && (
                          <div className="absolute inset-0 bg-black/75 flex items-center justify-center">
                            <span className="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">SOLD</span>
                          </div>
                        )}
                        <button
                          onClick={() => toggleWishlist(item.id, item.title)}
                          className="absolute top-2 right-2 p-2 rounded-full bg-slate-900/80 hover:bg-slate-900 text-white transition z-10"
                        >
                          <i data-lucide="heart" className={`w-4 h-4 ${isWishlisted ? 'fill-rose-400 text-rose-400' : 'text-slate-300'}`}></i>
                        </button>
                      </div>

                      <div className="p-5 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start mb-2">
                            <h3 className="font-semibold">{item.title}</h3>
                            <span className="font-bold text-indigo-400">₹{item.price}</span>
                          </div>
                          <p className="text-xs text-slate-400 line-clamp-2 mb-3">{item.description}</p>
                          
                          {/* SELLER DETAILS SHOWN IN EXPLORE */}
                          <div className="text-[11px] text-indigo-300 mb-3 bg-indigo-950/40 p-2 rounded border border-indigo-900/40">
                            👤 Seller: <span className="font-bold">{item.sellerName}</span> ({item.sellerEmail})
                          </div>
                        </div>

                        <div className="flex items-center justify-between border-t border-slate-800 pt-3">
                          <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400">
                            <i data-lucide="tag" className="w-3 h-3"></i>
                            {item.category}
                          </span>

                          {/* ACTION BUTTONS */}
                          {activePage === 'escaped' ? (
                            <button
                              onClick={() => toggleStatus(item.id)}
                              className={`text-xs font-medium px-2.5 py-1 rounded transition flex items-center gap-1 ${
                                item.status === 'available' ? 'text-amber-300 bg-amber-500/20' : 'text-emerald-300 bg-emerald-500/20'
                              }`}
                            >
                              <i data-lucide="check-circle-2" className="w-3 h-3"></i>
                              Mark {item.status === 'available' ? 'Sold' : 'Available'}
                            </button>
                          ) : (
                            <button
                              onClick={() => { setSelectedBuyItem(item); setShowBuyConfirmModal(true); }}
                              disabled={item.status === 'sold'}
                              className={`text-xs px-3 py-1 rounded-md font-medium transition ${
                                item.status === 'sold' ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                              }`}
                            >
                              {item.status === 'sold' ? 'Out of Stock' : 'Buy Now'}
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* BUY CONFIRMATION POPUP */}
          {showBuyConfirmModal && selectedBuyItem && (
            <div 
              ref={buyConfirmModalRef}
              onClick={(e) => handleModalBackdropClick(e, buyConfirmModalRef, () => setShowBuyConfirmModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-white space-y-4">
                <h3 className="text-lg font-bold text-indigo-400">Confirm Buy Order</h3>
                <p className="text-xs text-slate-300">
                  Are you sure you want to purchase <span className="font-bold text-white">"{selectedBuyItem.title}"</span> for <span className="font-bold text-emerald-400">₹{selectedBuyItem.price}</span> from {selectedBuyItem.sellerName}?
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowBuyConfirmModal(false)} className="px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-800 rounded">
                    Cancel
                  </button>
                  <button onClick={confirmBuyOrder} className="px-4 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold">
                    Confirm Purchase
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FLOATING MY ORDERS MODAL */}
          {showOrdersModal && (
            <div 
              ref={ordersModalRef}
              onClick={(e) => handleModalBackdropClick(e, ordersModalRef, () => setShowOrdersModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-6 text-white">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="shopping-bag" className="w-5 h-5 text-amber-400"></i>
                    My Orders & Financial Summary
                  </h3>
                  <button onClick={() => setShowOrdersModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                    <p className="text-[10px] text-slate-400 uppercase font-bold">Total Sales Earned</p>
                    <p className="text-2xl font-extrabold text-emerald-400 mt-1">₹{totalEarned}</p>
                  </div>
                  <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                    <p className="text-[10px] text-slate-400 uppercase font-bold">Purchases Completed</p>
                    <p className="text-2xl font-extrabold text-indigo-400 mt-1">₹1,150</p>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Sold Items ({soldItems.length})</h4>
                  {soldItems.length === 0 ? (
                    <p className="text-xs text-slate-500">No sold orders recorded yet.</p>
                  ) : (
                    <div className="space-y-2 max-h-40 overflow-y-auto">
                      {soldItems.map(i => (
                        <div key={i.id} className="flex justify-between items-center bg-slate-800/40 p-2 rounded text-xs">
                          <span>{i.title}</span>
                          <span className="font-bold text-emerald-400">+₹{i.price}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* SELL AN ITEM MODAL WITH GENERAL / INCOGNITO TOGGLE */}
          {showSellModal && (
            <div 
              ref={sellModalRef}
              onClick={(e) => handleModalBackdropClick(e, sellModalRef, () => setShowSellModal(false))}
              className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-xs"
            >
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-white">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold">Sell an Item</h2>
                  <button onClick={() => setShowSellModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddListing} className="space-y-4">
                  {/* GENERAL VS INCOGNITO TOGGLE SWITCH */}
                  <div className="bg-slate-800 p-1.5 rounded-xl flex items-center justify-between text-xs">
                    <span className="font-semibold text-slate-300">Listing Mode:</span>
                    <div className="flex gap-1">
                      <button
                        type="button"
                        onClick={() => setFormIsIncognito(false)}
                        className={`px-3 py-1 rounded-lg transition ${!formIsIncognito ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}
                      >
                        General
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormIsIncognito(true)}
                        className={`px-3 py-1 rounded-lg transition ${formIsIncognito ? 'bg-rose-600 text-white font-bold' : 'text-slate-400'}`}
                      >
                        Incognito 🕵️‍♂️
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium mb-1">Product Title</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Data Structures Textbook"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium mb-1">Category</label>
                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm outline-none"
                      >
                        <option value="Textbooks">Textbooks</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Lab Supplies">Lab Supplies</option>
                        <option value="Essentials">Essentials</option>
                        <option value="Others">Others</option>
                        <option value="Cheaper than your College">Cheaper than your College</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">Price (₹)</label>
                      <input
                        type="number"
                        required
                        placeholder="499"
                        value={formPrice}
                        onChange={(e) => setFormPrice(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium mb-1">Attach Image (JPG / PNG)</label>
                    <input
                      type="file"
                      accept="image/png, image/jpeg, image/jpg"
                      onChange={handleImageUpload}
                      className="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-medium">Description</label>
                      <button
                        type="button"
                        onClick={handleGenerateAI}
                        disabled={isGenerating}
                        className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium"
                      >
                        <i data-lucide="sparkles" className="w-3 h-3"></i>
                        {isGenerating ? 'Generating...' : 'Auto-Generate with AI'}
                      </button>
                    </div>
                    <textarea
                      rows={3}
                      required
                      value={formDesc}
                      onChange={(e) => setFormDesc(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm outline-none"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowSellModal(false)}
                      className="px-4 py-1.5 text-sm text-slate-400 hover:bg-slate-800 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-sm bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium"
                    >
                      Publish Listing
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* INCOGNITO STEALTH MODE TOGGLE (BOTTOM RIGHT CORNER) */}
          <div className="fixed bottom-4 right-4 z-40">
            <button
              onClick={() => {
                setIsIncognito(!isIncognito);
                triggerToast(isIncognito ? 'Exited Incognito Mode' : '🕵️‍♂️ Incognito Secret Mode Enabled!');
              }}
              className={`px-3 py-2 rounded-full text-xs font-bold border shadow-2xl flex items-center gap-2 transition ${
                isIncognito ? 'bg-rose-950 border-rose-700 text-rose-300' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'
              }`}
            >
              <i data-lucide="eye-off" className="w-4 h-4 text-rose-400"></i>
              <span>{isIncognito ? 'Exit Incognito Mode' : 'Incognito Mode 🕵️‍♂️'}</span>
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
